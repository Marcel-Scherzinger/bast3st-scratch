[workspace]
resolver = "3"
members = [
    "crates/scratch-test-value",
    "crates/scratch-test-model-proc",
    "crates/scratch-test-model",
    "crates/scratch-test-interpreter",
]

[workspace.package]
authors = ["Marcel Scherzinger"]
description = "The part of the Bast3St project that is responsible for dealing with Scratch programs"
homepage = "https://marcel-scherzinger.github.io/bast3st/"

[workspace.dependencies]
itertools = "0.15"
thiserror = "2.0"
either = "1.19.0"
utoipa = "6.0"
schemars = "1.2.1"
serde = "1.0"
serde_json = "1.0"
derive_more = "2.1"
log = "0.4.34"
derive-getters = "0.5.0"


# linting
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
enum_glob_use = "deny"

