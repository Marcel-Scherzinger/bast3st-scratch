[package]
name = "scratch-test-model"
version = "0.1.1"
edition = "2024"
homepage.workspace = true
authors.workspace = true

[dependencies]
either.workspace = true
itertools.workspace = true
thiserror.workspace = true
log.workspace = true

derive_more = { workspace = true, features = ["display", "from", "debug", "deref"] }
derive-getters.workspace = true

zip = { version = "9.0.3", optional = true, default-features = false, features = ["deflate64", "deflate"] }
const-str = { version = "1.1.0", default-features = false }
ouroboros = {version = "0.18.5", optional = true}

serde_json.workspace = true
serde = { workspace = true, features = ["derive", "rc"], optional = true }
schemars = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

scratch-test-model-proc = { path = "../scratch-test-model-proc" }

[dependencies.svalue]
path = "../scratch-test-value"
package = "scratch-test-value"
features = ["serde_json"]

[dev-dependencies]
walkdir = "2.5.0"
rayon = "1.11.0"
serde_json = "1.0"
self = { path = ".", features = ["serde", "schemars"], package = "scratch-test-model" }

[features]
default = ["sb3"]
sb3 = [ "dep:zip", "dep:ouroboros" ]
thread-share = ["svalue/thread-share"]
serde = ["dep:serde"]
schemars = ["dep:schemars", "serde", "svalue/schemars"]
utoipa = ["dep:utoipa", "serde", "svalue/utoipa"]
